[package]
name = "p2p-cli"
version.workspace = true
edition.workspace = true
description = "实验用命令行工具：bootstrap/node/ping/discover（design \u00a712、experiment-env E1-E3 执行载体）"

[[bin]]
name = "p2p-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bs58 = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }

p2p = { path = "../p2p" }
p2p-log = { path = "../p2p-log" }
p2p-identity = { path = "../p2p-identity" }
p2p-mux = { path = "../p2p-mux" }
p2p-protocol = { path = "../p2p-protocol" }
p2p-relay = { path = "../p2p-relay" }
p2p-transport = { path = "../p2p-transport" }

# llm-share 管理面（T21）：allowlist/声明签发/流水/收据验签纯逻辑层，clap 面在 apps/cli。
serde = { workspace = true }
serde_json = { workspace = true }
llm-share-ledger = { path = "../llm-share-ledger" }
llm-share-offer = { path = "../llm-share-offer" }
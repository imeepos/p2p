acp-agent = { path = "../../apps/acp-agent" }
acp-common = { path = "../../apps/acp-common" }
acp-console = { path = "../../apps/acp-console" }
a2a = { path = "../a2a" }
llm-share-ledger = { path = "../llm-share-ledger" }
llm-share-offer = { path = "../llm-share-offer" }
llm-share-proxy = { path = "../llm-share-proxy" }
p2p = { path = "../p2p" }
p2p-chat = { path = "../p2p-chat" }
p2p-log = { path = "../p2p-log" }
p2p-swarm = { path = "../p2p-swarm" }
p2p-identity = { path = "../p2p-identity" }
p2p-mux = { path = "../p2p-mux" }
p2p-protocol = { path = "../p2p-protocol" }
p2p-security = { path = "../p2p-security" }
p2p-transport = { path = "../p2p-transport" }
repair-bridge = { path = "../repair-bridge" }
repair-helper = { path = "../repair-helper" }

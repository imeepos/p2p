[package]
name = "rd-capture"
version.workspace = true
edition.workspace = true
description = "远程桌面屏幕采集抽象：CaptureSource trait + 确定性合成源（测试/E2E）；sck feature 启用 macOS ScreenCaptureKit 真实源"

[features]
default = []
# macOS 真实采集：screencapturekit（Swift 运行时，需 macOS 13+/Xcode swift 工具链；
# 无运行时环境下禁用本 feature 保持零 Swift 依赖）
sck = ["dep:screencapturekit"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=10.0.3", optional = true }
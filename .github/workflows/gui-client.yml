# p2p-console 客户端打包流水线：三平台构建 Tauri 应用并上传产物
# 触发：手动 / client-v* 标签（附 GitHub Release）/ main 分支 push 与 PR
# main push 刻意不做 paths 过滤：paths 与 tags 同块时 tag 事件可能被静默滤掉（发布不可静默失败），
# 宁可 gate 对全部 main push 运行（超集，见 docs/release-gates.md §2 L4）
# 说明：macOS 产物未签名（内部使用）；Linux 走 AppImage+deb；Windows 走 NSIS+MSI
name: gui-client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "client-v*"
  pull_request:
    paths:
      - ".github/workflows/gui-client.yml"
      - "apps/gui/**"
    branches:
      - main

concurrency:
  group: gui-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快门禁：合并/发布前先把版本、类型/lint/单测跑掉，失败不进打包矩阵
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0：tag 祖先校验需要全历史（origin/main 可达性判定）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 仅 tag 触发时校验：tag 指向的 commit 必须已在 origin/main 历史内，
      # 防止 feature 分支未合并代码被 tag 直接发布；PR/分支/手动运行不受影响
      - name: tag 祖先校验（tag 提交必须在 origin/main 上）
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          set -euo pipefail
          git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "tag-gate: PASS $commit 在 origin/main 历史内"
          else
            echo "tag-gate: FAIL $commit 不在 origin/main 上，拒绝发布（tag 只允许打在已合并 main 的提交）" >&2
            exit 1
          fi

      - run: bash scripts/check/version.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/gui lint
      - run: pnpm -C apps/gui test
      - run: pnpm -C apps/gui build
      - run: bash apps/gui/scripts/check/i18n-diff.sh

  # 打包矩阵：main push 只跑上面的 gate；tag/手动/PR 才进构建
  build:
    needs: gate
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/client-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
            args: ""
          - os: macos-15-intel        # Intel
            args: ""
          - os: ubuntu-22.04
            args: "--bundles appimage deb"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/gui/src-tauri

      - name: 安装 Linux 系统依赖（WebKit/GTK）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 诊断 updater 签名输入（2026-09-05 四平台同挂打包步，免拉日志定位）：
      # 只输出存在性/长度/尾空白，绝不输出密钥内容。
      - name: 诊断 updater 签名输入
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "diag: TAURI_SIGNING_PRIVATE_KEY 为空——secret 未配置/名字不符/作用域不可见（候选①）"
          else
            echo "diag: key 长度=${#TAURI_SIGNING_PRIVATE_KEY}（末尾换行=$([ "${TAURI_SIGNING_PRIVATE_KEY%%$'\n'}" != "$TAURI_SIGNING_PRIVATE_KEY" ] && echo yes || echo no)）"
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD+x}" ]; then
            echo "diag: PASSWORD 变量存在（值是否非空=$([ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && echo 非空 || echo 空)）"
          else
            echo "diag: PASSWORD 变量不存在（等价空串）"
          fi

      - name: Tauri 打包
        working-directory: apps/gui
        shell: bash
        env:
          # updater 增量包签名（minisign，契约 v8 加法）：bundle.createUpdaterArtifacts 开启后
          # 无私钥 tauri build 直接失败，从机制上杜绝发布未签名增量包；fork PR 无 secret 会在
          # 此步显式失败（gate 门禁不受影响），本仓库 PR 均来自同仓库、可读到 secret
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: 上传 macOS 产物
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@v4
        with:
          name: p2p-console-${{ matrix.os }}
          path: |
            apps/gui/src-tauri/target/release/bundle/macos/*.app
            apps/gui/src-tauri/target/release/bundle/dmg/*.dmg
            # updater 增量包与签名（目录随 Tauri 版本有 bundle/macos 与 release/macos 两种落点，双 glob 兜底）
            apps/gui/src-tauri/target/release/bundle/macos/*.app.tar.gz*
            apps/gui/src-tauri/target/release/macos/*.app.tar.gz*
          if-no-files-found: error

      - name: 上传 Linux 产物
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: p2p-console-linux
          path: |
            apps/gui/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/gui/src-tauri/target/release/bundle/deb/*.deb
            # updater 增量包与签名
            apps/gui/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz*
          if-no-files-found: error

      - name: 上传 Windows 产物
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: p2p-console-windows
          path: |
            apps/gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/gui/src-tauri/target/release/bundle/msi/*.msi
            # updater 增量包与签名（NSIS zip 为 v2 updater 格式）
            apps/gui/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 生成 updater 清单（契约 v8 加法）：客户端经 releases/latest/download/latest.json
      # 发现更新；脚本对四平台签名产物做存在性与配对校验，缺一即发布失败
      - uses: actions/checkout@v4
      - name: 生成 latest.json 更新清单
        run: node apps/gui/scripts/release/make-latest-json.mjs --artifacts artifacts --tag "$GITHUB_REF_NAME" --repo imeepos/p2p

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

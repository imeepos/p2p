# p2p-console 客户端打包流水线：三平台构建 Tauri 应用并上传产物
# 触发：手动 / client-v* 标签（附 GitHub Release）/ main 分支 GUI 相关路径变更
# 说明：macOS 产物未签名（内部使用）；Linux 走 AppImage+deb；Windows 走 NSIS+MSI
name: gui-client

on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"
  pull_request:
    paths:
      - ".github/workflows/gui-client.yml"
      - "apps/gui/**"
    branches:
      - main

concurrency:
  group: gui-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快门禁：合并前先把类型/lint/单测跑掉，失败不进打包矩阵
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/gui lint
      - run: pnpm -C apps/gui test
      - run: pnpm -C apps/gui build
      - run: bash apps/gui/scripts/check/i18n-diff.sh

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
            args: ""
          - os: macos-13              # Intel
            args: ""
          - os: ubuntu-22.04
            args: "--bundles appimage deb"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/gui/src-tauri

      - name: 安装 Linux 系统依赖（WebKit/GTK）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: Tauri 打包
        working-directory: apps/gui
        shell: bash
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: 上传 macOS 产物
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-13'
        uses: actions/upload-artifact@v4
        with:
          name: p2p-console-${{ matrix.os }}
          path: |
            apps/gui/src-tauri/target/release/bundle/macos/*.app
            apps/gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 上传 Linux 产物
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: p2p-console-linux
          path: |
            apps/gui/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/gui/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: 上传 Windows 产物
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: p2p-console-windows
          path: |
            apps/gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/gui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

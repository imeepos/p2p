# GitHub 主线全量门禁：实际远端为 GitHub，不能依赖未启用的 Gitea workflow
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 ref 连续 push 只跑最新（gui-client.yml 同款口径），防过时 run 堆积排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # 根 workspace 与 src-tauri 两个 target 目录都缓存：cargo 冷编译
      # 12 分钟是大头，二次 run 走缓存后门禁墙钟主要由测试本体构成
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .
            apps/gui/src-tauri
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 全量门禁
        run: make check

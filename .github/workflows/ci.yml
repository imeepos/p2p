# GitHub 主线全量门禁：实际远端为 GitHub，不能依赖未启用的 Gitea workflow
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 ref 连续 push 只跑最新（gui-client.yml 同款口径），防过时 run 堆积排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      # 组件必须装到 rust-toolchain.toml 锁定的工具链上（组件若经 action
      # 的 components 输入安装会挂在 stable 上，与锁定版错位）：run 步的
      # cwd 即仓库根，rustup 按 .toml 解析活动工具链，单一事实源在文件里
      - run: rustup component add clippy rustfmt
      # Tauri v2 Linux 依赖（清单与 gui-client.yml ubuntu 打包腿一致，已实证）：
      # 装上后 gui-tauri.sh/clippy.sh 的「缺 webkit2gtk-4.1 即 SKIP」声明式
      # 口径自动解除——src-tauri 的 fmt/clippy/test 在 ubuntu 真跑，收口盲区
      - name: 安装 Linux 系统依赖（WebKit/GTK）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev
      # 根 workspace 与 src-tauri 两个 target 目录都缓存：cargo 冷编译
      # 12 分钟是大头，二次 run 走缓存后门禁墙钟主要由测试本体构成
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .
            apps/gui/src-tauri
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 全量门禁
        run: make check

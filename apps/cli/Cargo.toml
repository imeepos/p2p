[package]
name = "p2pctl"
version = "0.1.0"
edition = "2021"
description = "p2pctl：GUI 命令面的等价 CLI（对等裁定：GUI 全部操作均有 CLI 入口）"

# 独立 cargo 项目，脱离根 workspace（沿用 apps/gui/src-tauri 先例；根 Cargo.toml 不动）
[workspace]

[[bin]]
name = "p2pctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# 底座复用入口（路径依赖，禁止复制实现）：CL1 探测不消费其运行时，
# CL2 起节点/配置/档案/对端/身份域直接复用 p2p-cli 与底座 crate 能力。
p2p-cli = { path = "../../crates/p2p-cli" }

[package]
name = "p2pctl"
version = "0.1.0"
edition = "2021"
description = "p2pctl：GUI 命令面的等价 CLI（对等裁定：GUI 全部操作均有 CLI 入口）"

# 独立 cargo 项目，脱离根 workspace（沿用 apps/gui/src-tauri 先例；根 Cargo.toml 不动）
[workspace]

[[bin]]
name = "p2pctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "io-util", "time"] }
# peer id 字符串解析（chat send 未送达重投时主动 connect 用）
bs58 = "0.5"
libc = "0.2"

# 底座复用入口（路径依赖，禁止复制实现）：节点域复用 facade 与日志装配。
p2p = { path = "../../crates/p2p" }
p2p-swarm = { path = "../../crates/p2p-swarm" }
p2p-cli = { path = "../../crates/p2p-cli" }
p2p-log = { path = "../../crates/p2p-log" }

# chat 域（CL3）：复用 p2p-chat 门面（好友簿/历史/发送/媒体）。
p2p-chat = { path = "../../crates/p2p-chat" }

# 更新域（CL4）：GitHub Releases 检查（TLS 走 rustls，同 GUI 选型不引 openssl）
# 与发布页白名单校验。
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"

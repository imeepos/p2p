[package]
name = "acp-console"
version = "0.1.0"
edition = "2021"
description = "ACP over P2P 操作者侧伴生进程：本地 WS(127.0.0.1+token) ⇄ P2P 流哑泵 + 节点发现 + 连接状态机（设计 §3/§6）"

# 独立 cargo 项目，脱离根 workspace（沿用 apps/acp-common、apps/cli 先例；根 Cargo.toml 不动）
[workspace]

[[bin]]
name = "acp-console"
path = "src/main.rs"

[dependencies]
# 桥共享纯库：握手帧编解码/错误码/常量（禁止复制实现）
acp-common = { path = "../acp-common" }
# 底座复用入口（路径依赖）：facade 拨号面与日志装配
p2p = { path = "../../crates/p2p" }
p2p-swarm = { path = "../../crates/p2p-swarm" }
p2p-log = { path = "../../crates/p2p-log" }
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# 集成测试：模拟 agent 端点实现 ProtocolHandler（p2p 已 re-export，无需单独 path-dep）
[dev-dependencies]
async-trait = "0.1"

[package]
name = "acp-console"
version = "0.1.0"
edition = "2021"
description = "已废弃的独立 CLI 入口：仅保留为 acp-pump 薄壳保编译，INLINE-ACP-PUMP T5 删除"

# 独立 cargo 项目，脱离根 workspace（沿用 apps/acp-common、apps/cli 先例；根 Cargo.toml 不动）
[workspace]

[[bin]]
name = "acp-console"
path = "src/main.rs"

[dependencies]
# 泵领域库（INLINE-ACP-PUMP T1 起实现收口于此，本 crate 只剩 CLI 翻译层）
acp-pump = { path = "../../crates/acp-pump" }
# REATTACH_WINDOW_DEFAULT_SECS 默认值仍取桥共享常量
acp-common = { path = "../acp-common" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
p2p-log = { path = "../../crates/p2p-log" }

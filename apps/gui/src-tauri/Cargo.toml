[package]
name = "p2p-console"
version = "0.1.3"
edition = "2021"
description = "p2p-console Tauri 桥接（gui-contract.md §1 命令面 / §2 事件面）"

# 独立 cargo 项目，脱离根 workspace（gui-contract.md §4；根 Cargo.toml 已 exclude 双保险）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
p2p = { path = "../../../crates/p2p" }
# p2p-cli 复用其 pub mod echo 的协议常量与 handler（协调者裁决：允许 path 依赖）
# p2p-swarm 取 DialHop/MetricsSnapshot 原始类型（p2p 传递依赖）
p2p-cli = { path = "../../../crates/p2p-cli" }
p2p-swarm = { path = "../../../crates/p2p-swarm" }
# IM 聊天门面（契约 v7 §12，T32 消费面）
p2p-chat = { path = "../../../crates/p2p-chat" }
# 统一日志设施（E7-L1）：替换自带 tracing_subscriber 初始化
p2p-log = { path = "../../../crates/p2p-log" }
bs58 = "0.5"
# 附件 dataBase64 解码（契约 §12.3 ChatMediaInput）
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# test feature 供集成测试用 mock runtime 直调命令层（不起 webview）；
# protocol-asset 供 assetProtocol（契约 v7 §12：chat 媒体预览 convertFileSrc）
tauri = { version = "2", features = ["test", "protocol-asset"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
# 在线更新检查（契约 v4 §9，G-U1）：TLS 走 rustls（图内已有，不引 openssl）
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# release published_at 的 RFC3339 解析
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# 系统浏览器打开发布页（命令内 Rust 侧调用，不经前端 ACL）
tauri-plugin-opener = "2"
# 应用内下载安装更新（契约 v8 加法，G-U3）：官方 updater 插件（minisign 签名校验）
tauri-plugin-updater = "2"
# 更新安装完成后重启应用（relaunch）
tauri-plugin-process = "2"
# 发布页白名单校验（url 已是 tauri 传递依赖，零新增编译成本）
url = "2"

# GC1 本地控制通道（docs/design/gui-control-channel.md）：仅绑 127.0.0.1 的 HTTP JSON + token 鉴权
tiny_http = "0.12"
# 截图 PNG 编解码（screenshot 落盘 / 快照帧解码）
png = "0.17"
# 录屏最小闭环：定时采样帧编码 GIF（格式不限，免 ffmpeg）
gif = "0.13"
# 控制通道 token 生成（OS 随机源，已是 tauri 传递依赖）
getrandom = "0.2"
# W1 数据目录文件监听：非递归 watch + 防抖归并（禁递归风暴）。
# notify 统一经 notify_debouncer_mini 的 re-export 使用，禁止直连依赖：
# 两处版本漂移会让 Watcher trait 不匹配（notify 7/8 双版本编译错误）。
notify-debouncer-mini = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# WKWebView takeSnapshot 截图：与 wry 同版 objc2 生态（0.3.x 配 objc2 0.6），不引新增大依赖
# feature 为类粒度：WKWebView/WKSnapshotConfiguration(+block2)、NSImage/NSBitmapImageRep
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3", features = [
  "WKWebView",
  "WKSnapshotConfiguration",
  "block2",
] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = [
  "NSDictionary",
  "NSData",
  "NSError",
  "NSString",
] }


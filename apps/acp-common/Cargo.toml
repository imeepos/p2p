[package]
name = "acp-common"
version = "0.1.0"
edition = "2021"
description = "ACP over P2P 桥两端共享纯库：握手帧编解码 / ndjson 分块重组 / 错误码 / 策略表（零网络、零进程逻辑）"

# 独立 cargo 项目，脱离根 workspace（沿用 apps/cli 先例；根 Cargo.toml 不动）
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

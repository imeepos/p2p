[workspace]
resolver = "2"
members = ["crates/*"]

# GUI 壳（Tauri 应用）是独立 cargo 项目，不参与底座 workspace（docs/design/gui-plan.md §7）
exclude = ["apps/gui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
socket2 = "0.6"
async-trait = "0.1"
bytes = "1"
thiserror = "1"
tracing = "0.1"
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
snow = "0.9"
yamux = "0.13"
mdns-sd = "0.13"
prost = "0.13"
futures = "0.3"
x509-cert = "0.2"
ring = "0.17"
der = "0.7"
repair-playbook = { path = "crates/repair-playbook" }

[profile.release]
lto = "thin"